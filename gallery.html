<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Video Slider</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

  <style>
    :root {
      --turmeric-yellow: #FFC72C;
      --saffron-orange: #FF9933;
      --off-white: #FAF9F6;
      --dark-brown: #3A2618;
      --warm-beige: #f0e6d2;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
      background-color: var(--off-white); 
    }
    
    
    .background-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 10% 20%, rgba(255, 199, 44, 0.12) 0%, transparent 20%),
                  radial-gradient(circle at 90% 80%, rgba(255, 153, 51, 0.12) 0%, transparent 20%);
      z-index: 0;
    }
    
    .container {
      max-width: 1200px;
      width: 100%;
      position: relative;
      z-index: 2;
    }
    
    .slider-container {
      position: relative;
      padding: 40px 0;
      border-radius: 20px;
    }
    
    .section-title {
      text-align: center;
      margin-bottom: 40px;
      position: relative;
      padding: 0 20px;
    }
    
    .section-title h1 {
      font-size: 3rem;
      font-weight: 700;
      color: var(--dark-brown);
      margin: 0;
      letter-spacing: 1px;
      text-transform: uppercase;
      position: relative;
      display: inline-block;
      padding-bottom: 15px;
    }
    
    .section-title h1::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 4px;
      background: linear-gradient(90deg, var(--saffron-orange), var(--turmeric-yellow));
      border-radius: 2px;
    }
    
    .slider-wrapper {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 10px 0;
    }
    
    .slider-wrapper::-webkit-scrollbar {
      display: none;
    }
    
    .card {
      position: relative;
      flex: 0 0 auto;
      width: 250px;
      height: 400px;
      margin: 0 15px;
      background: white;
      border-radius: 20px;
      scroll-snap-align: start;
      overflow: hidden;
      box-shadow: 0 12px 25px rgba(58, 38, 24, 0.25);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                 box-shadow 0.4s ease;
      transform-origin: center;
      border: 3px solid transparent;
    }
    
    .card:hover {
      transform: translateY(-15px) scale(1.03);
      /* box-shadow: 0 20px 40px rgba(255, 153, 51, 0.45); */
      border-color: rgba(255, 153, 51, 0.4);
    }
    
    .video-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 20px;
    }
    
    .card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.8s ease;
    }
    
    .card:hover video {
      transform: scale(1.08);
    }
    
    .play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 30px;
      color: white;
      background: linear-gradient(135deg, var(--saffron-orange), var(--turmeric-yellow));
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: all 0.4s ease;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
      border: 3px solid white;
      opacity: 0.9;
    }
    
    .card:hover .play-icon {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.2);
    }
    
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: linear-gradient(135deg, var(--saffron-orange), var(--turmeric-yellow));
      color: white;
      border: none;
      font-size: 24px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 3;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(255, 153, 51, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .nav-btn:hover {
      transform: translateY(-50%) scale(1.12);
      box-shadow: 0 10px 25px rgba(255, 153, 51, 0.6);
    }
    
    .nav-left { 
      left: -30px; 
    }
    
    .nav-right { 
      right: -30px; 
    }
    
    .slider-indicators {
      display: flex;
      justify-content: center;
      margin-top: 30px;
      gap: 10px;
    }
    
    .indicator {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #d0c0a0;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .indicator.active {
      background: linear-gradient(135deg, var(--saffron-orange), var(--turmeric-yellow));
      transform: scale(1.3);
    }
    
    .spice-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    
    .spice-element {
      position: absolute;
      font-size: 4rem;
      opacity: 0.1;
      animation: float 8s infinite ease-in-out;
    }
    
    .spice-1 { 
      top: 10%; 
      left: 5%; 
      color: var(--saffron-orange);
      animation-delay: 0s;
    }
    
    .spice-2 { 
      top: 20%; 
      right: 8%; 
      color: var(--turmeric-yellow);
      animation-delay: 1s;
    }
    
    .spice-3 { 
      bottom: 15%; 
      left: 12%; 
      color: var(--saffron-orange);
      animation-delay: 2s;
    }
    
    .spice-4 { 
      bottom: 25%; 
      right: 15%; 
      color: var(--turmeric-yellow);
      animation-delay: 3s;
    }
    
    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-25px) rotate(10deg);
      }
    }
    
    /* Mobile-specific styles */
    @media (max-width: 768px) {
      .slider-wrapper {
        scroll-snap-type: x mandatory;
        scroll-padding: 0 30px;
      }
      
      .card {
        width: calc(100vw - 60px);
        scroll-snap-align: center;
        margin: 0 30px;
      }
      
      .nav-left {
        left: 10px;
      }
      
      .nav-right {
        right: 10px;
      }
      
      .section-title h1 {
        font-size: 2.2rem;
      }
      
      .card {
        height: 380px;
      }
      
      .nav-btn {
        width: 50px;
        height: 50px;
        font-size: 20px;
      }
    }
    
    @media (max-width: 600px) {
      .card {
        width: calc(100vw - 40px);
        margin: 0 20px;
        height: 360px;
      }
      
      .section-title h1 {
        font-size: 1.8rem;
      }
    }
    
    @media (max-width: 480px) {
      .card {
        width: calc(100vw - 30px);
        margin: 0 15px;
        height: 340px;
      }
      
      .nav-btn {
        width: 40px;
        height: 40px;
        font-size: 18px;
      }
      
      .section-title h1 {
        font-size: 1.6rem;
      }
      
      .section-title h1::after {
        width: 80px;
        height: 3px;
      }
    }
  </style>
</head>
<body>
  <!-- Background layer instead of body background -->
  <div class="background-layer"></div>
  
  <!-- Spice overlay -->
  <div class="spice-overlay">
    <div class="spice-element spice-1">🌶️</div>
    <div class="spice-element spice-2">🧅</div>
    <div class="spice-element spice-3">🧄</div>
    <div class="spice-element spice-4">🍋</div>
  </div>
  
  <div class="container">
    <div class="slider-container">
      <div class="section-title">
        <h2>Gallery</h2>
      </div>
    
      <button class="nav-btn nav-left" onclick="scrollSlider(-1)">
        <i class="fas fa-chevron-left"></i>
      </button>
      
      <div class="slider-wrapper" id="sliderWrapper">
        <!-- Card 1 -->
        <div class="card" onmouseenter="playVideo(this)" onmouseleave="pauseVideo(this)">
          <div class="video-container">
            <video muted loop playsinline preload="metadata">
              <source src="https://media.w3.org/2010/05/sintel/trailer.mp4" type="video/mp4">
            </video>
            <div class="play-icon">
              <i class="fas fa-play"></i>
            </div>
          </div>
        </div>
        
        <!-- Card 2 -->
        <div class="card" onmouseenter="playVideo(this)" onmouseleave="pauseVideo(this)">
          <div class="video-container">
            <video muted loop playsinline preload="metadata">
              <source src="https://media.w3.org/2010/05/bunny/movie.mp4" type="video/mp4">
            </video>
            <div class="play-icon">
              <i class="fas fa-play"></i>
            </div>
          </div>
        </div>
        
        <!-- Card 3 -->
        <div class="card" onmouseenter="playVideo(this)" onmouseleave="pauseVideo(this)">
          <div class="video-container">
            <video muted loop playsinline preload="metadata">
              <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
            </video>
            <div class="play-icon">
              <i class="fas fa-play"></i>
            </div>
          </div>
        </div>
        
        <!-- Card 4 -->
        <div class="card" onmouseenter="playVideo(this)" onmouseleave="pauseVideo(this)">
          <div class="video-container">
            <video muted loop playsinline preload="metadata">
              <source src="https://media.w3.org/2010/05/video/movie_300.mp4" type="video/mp4">
            </video>
            <div class="play-icon">
              <i class="fas fa-play"></i>
            </div>
          </div>
        </div>
        
        <!-- Card 5 -->
        <div class="card" onmouseenter="playVideo(this)" onmouseleave="pauseVideo(this)">
          <div class="video-container">
            <video muted loop playsinline preload="metadata">
              <source src="https://samplelib.com/lib/preview/mp4/sample-5s.mp4" type="video/mp4">
            </video>
            <div class="play-icon">
              <i class="fas fa-play"></i>
            </div>
          </div>
        </div>
      </div>
      
      <button class="nav-btn nav-right" onclick="scrollSlider(1)">
        <i class="fas fa-chevron-right"></i>
      </button>
      
      <div class="slider-indicators" id="sliderIndicators">
        <!-- Indicators will be generated by JavaScript -->
      </div>
    </div>
  </div>

  <script>
    const slider = document.getElementById("sliderWrapper");
    const indicatorsContainer = document.getElementById("sliderIndicators");
    const cards = document.querySelectorAll('.card');
    let cardWidth = 350; // Default width + margin
    
    // Create indicators based on number of cards
    cards.forEach((_, index) => {
      const indicator = document.createElement('div');
      indicator.className = 'indicator';
      if(index === 0) indicator.classList.add('active');
      indicator.addEventListener('click', () => {
        scrollToCard(index);
      });
      indicatorsContainer.appendChild(indicator);
    });
    
    // Function to calculate current card width
    function calculateCardWidth() {
      if (cards.length > 0) {
        const card = cards[0];
        const style = window.getComputedStyle(card);
        const width = card.offsetWidth;
        const margin = parseFloat(style.marginLeft) + parseFloat(style.marginRight);
        return width + margin;
      }
      return 350; // Default value
    }
    
    // Update card width on resize
    window.addEventListener('resize', () => {
      cardWidth = calculateCardWidth();
    });
    
    // Initialize card width
    cardWidth = calculateCardWidth();
    
    function scrollSlider(direction) {
      slider.scrollBy({
        left: direction * cardWidth,
        behavior: 'smooth'
      });
      
      // Update indicators after a delay to allow scroll to complete
      setTimeout(updateIndicators, 300);
    }
    
    function scrollToCard(index) {
      slider.scrollTo({
        left: index * cardWidth,
        behavior: 'smooth'
      });
      
      // Update active indicator immediately
      document.querySelectorAll('.indicator').forEach((ind, i) => {
        ind.classList.toggle('active', i === index);
      });
    }
    
    function updateIndicators() {
      const scrollPos = slider.scrollLeft;
      const currentIndex = Math.round(scrollPos / cardWidth);
      
      document.querySelectorAll('.indicator').forEach((ind, index) => {
        ind.classList.toggle('active', index === currentIndex);
      });
    }
    
    // Update indicators on scroll
    slider.addEventListener('scroll', updateIndicators);
    
    function playVideo(card) {
      const video = card.querySelector("video");
      video.play();
    }

    function pauseVideo(card) {
      const video = card.querySelector("video");
      video.pause();
      video.currentTime = 0;
    }
  </script>
</body>
</html>
